services:
  # 📹 API DE SERVING (FASTAPI + INFERÊNCIA DA IA)
  fastapi-serving:
    build: .
    container_name: corrosion_fastapi_serving
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /dev/video0:/dev/video0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: python src/serving/app.py

  # 🏆 TRACKING SERVER DO MLFLOW
  mlflow-server:
    build: .
    container_name: corrosion_mlflow_server
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    command: mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlruns/mlflow.db

  # 🚀 AIRFLOW HUB (STANDALONE: WEB + SCHEDULER)
  airflow-standalone:
    build: .
    container_name: corrosion_airflow_standalone
    restart: always
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW_HOME=/app/airflow_home
    volumes:
      - .:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: airflow standalone

  # 🧭 AIRFLOW DAG PROCESSOR (ISOLADO PARA O AIRFLOW 3.0+)
  airflow-processor:
    build: .
    container_name: corrosion_airflow_processor
    restart: always
    environment:
      - AIRFLOW_HOME=/app/airflow_home
    volumes:
      - .:/app
    depends_on:
      - airflow-standalone
    command: airflow dag-processor
