services:
  # 📹 API DE SERVING (FASTAPI + INFERÊNCIA DA IA)
  fastapi-serving:
    build: .
    container_name: corrosion_fastapi_serving
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      UVICORN_HOST: 0.0.0.0
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
    volumes:
      - .:/app
    depends_on:
      mlflow-server:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: python src/serving/app.py

  # 🏆 TRACKING SERVER DO MLFLOW
  mlflow-server:
    build: .
    container_name: corrosion_mlflow_server
    restart: always
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-data:/mlflow
    command:
      - mlflow
      - ui
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - mlflow-server:5000,localhost:5000,127.0.0.1:5000
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # 🚀 AIRFLOW HUB (STANDALONE: WEB + SCHEDULER)
  airflow-standalone:
    build: .
    container_name: corrosion_airflow_standalone
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    shm_size: 2gb
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /app/dags
      CORROSION_PROJECT_ROOT: /app
      CORROSION_API_URL: http://fastapi-serving:8000
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
    volumes:
      - .:/app
      - ${HOME}/airflow:/opt/airflow
    depends_on:
      mlflow-server:
        condition: service_healthy
      fastapi-serving:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: airflow standalone

volumes:
  mlflow-data:
